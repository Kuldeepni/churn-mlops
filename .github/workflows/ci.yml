name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff mypy
      - run: ruff check src tests scripts
      - run: ruff format --check src tests scripts
      - run: mypy --config-file pyproject.toml src/churn

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ matrix.python-version }}-${{ hashFiles('requirements.lock') }}
      - run: pip install -e ".[dev]"
      - run: pytest --cov=churn --cov-report=xml --cov-fail-under=65
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml

  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-pipeline-${{ hashFiles('requirements.lock') }}
      - run: pip install -r requirements.lock
      - run: dvc repro
      - run: python -m churn.evaluate
      - uses: actions/upload-artifact@v4
        with:
          name: pipeline-artifacts
          path: |
            reports/
            docs/figures/
            models/

  docker:
    needs: [pipeline]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v8
        with:
          name: pipeline-artifacts
          path: .
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
      - name: smoke test
        run: |
          docker run -d --name smoke -p 8010:8000 ghcr.io/${{ github.repository }}:latest || docker run -d --name smoke -p 8010:8000 churn-mlops:local
          sleep 10
          curl -f http://127.0.0.1:8010/health
          docker rm -f smoke
