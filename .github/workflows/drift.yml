name: Drift Check

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: dvc repro
      - run: python scripts/simulate_traffic.py --shift
      - run: python -m churn.monitoring.drift || true
      - uses: actions/upload-artifact@v4
        with:
          name: drift-report
          path: reports/drift.json
