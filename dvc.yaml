stages:
  ingest:
    cmd: python -m churn.data.ingest
    outs:
      - data/raw/Telco-Customer-Churn.csv
      - data/raw/manifest.json
  clean_split:
    cmd: python -m churn.data.clean && python -m churn.data.split
    deps:
      - data/raw/Telco-Customer-Churn.csv
    outs:
      - data/interim/clean.parquet
      - data/processed/train.parquet
      - data/processed/val.parquet
      - data/processed/test.parquet
  train:
    cmd: python -m churn.models.train
    deps:
      - data/processed/train.parquet
    outs:
      - models/uncalibrated_pipeline.joblib
    metrics:
      - reports/model_comparison.json
  calibrate:
    cmd: python -m churn.models.calibrate
    deps:
      - models/uncalibrated_pipeline.joblib
      - data/processed/val.parquet
    outs:
      - models/calibrated_pipeline.joblib
  threshold:
    cmd: python -m churn.models.threshold
    deps:
      - models/calibrated_pipeline.joblib
      - data/processed/val.parquet
    outs:
      - reports/threshold.json
  evaluate:
    cmd: python -m churn.models.bundle && python -m churn.evaluate
    deps:
      - models/calibrated_pipeline.joblib
      - data/processed/test.parquet
    outs:
      - models/pipeline.joblib
      - models/base_pipeline.joblib
      - models/metadata.json
      - models/reference_stats.json
    metrics:
      - reports/metrics.json:
          cache: false
